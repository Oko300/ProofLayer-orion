<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProofLayer — Intelligence Layer for Crypto Markets</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e5e5e5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#0f0f1a;border-bottom:1px solid #1e1e3a;padding:16px 32px;display:flex;align-items:center;gap:12px}
.logo{font-size:1.3rem;font-weight:700;color:#7c3aed;letter-spacing:-0.5px}
.logo span{color:#a78bfa}
.tagline{color:#555;font-size:0.8rem;margin-left:8px}
.tabs{display:flex;gap:0;border-bottom:1px solid #1e1e3a;background:#0f0f1a;padding:0 32px}
.tab{padding:14px 24px;border:none;background:none;color:#666;cursor:pointer;font-size:0.9rem;border-bottom:2px solid transparent;transition:all 0.2s}
.tab:hover{color:#a78bfa}
.tab.active{color:#a78bfa;border-bottom:2px solid #7c3aed}
.main{padding:32px;max-width:900px;margin:0 auto}
.section-label{font-size:0.75rem;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:20px}

/* Live ticker */
.ticker{display:flex;gap:12px;margin-bottom:28px;overflow-x:auto;padding-bottom:4px}
.ticker-card{background:#0f0f1a;border:1px solid #1e1e3a;border-radius:10px;padding:12px 18px;flex-shrink:0;min-width:160px}
.ticker-name{font-size:0.72rem;color:#666;margin-bottom:4px}
.ticker-price{font-size:1.1rem;font-weight:700;color:#e5e5e5}
.ticker-change{font-size:0.78rem;margin-top:3px}
.ticker-change.up{color:#4ade80}
.ticker-change.down{color:#f87171}
.ticker-vol{font-size:0.72rem;color:#555;margin-top:2px}

/* Caution banner */
.caution-banner{background:#131320;border:1px solid #2a2a4a;border-left:3px solid #7c3aed;border-radius:8px;padding:12px 16px;margin-bottom:24px;font-size:0.82rem;color:#888;line-height:1.55}
.caution-banner strong{color:#a78bfa}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
label{font-size:0.78rem;color:#888;font-weight:500}
input,select{background:#131320;border:1px solid #1e1e3a;border-radius:8px;padding:10px 14px;color:#e5e5e5;font-size:0.9rem;width:100%;outline:none;transition:border 0.2s}
input:focus,select:focus{border-color:#7c3aed}
.btn{width:100%;padding:14px;background:#7c3aed;color:white;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:background 0.2s;margin-top:4px}
.btn:hover{background:#6d28d9}
.btn:disabled{background:#333;cursor:not-allowed}
.btn-sm{background:#1e1e3a;color:#a78bfa;border:none;border-radius:6px;padding:6px 12px;font-size:0.78rem;cursor:pointer;margin-left:8px}
.btn-sm:hover{background:#2a2a4a}

/* Verdict */
.verdict{margin-top:28px;border-radius:14px;overflow:hidden;border:1px solid #1e1e3a}
.verdict-header{padding:24px 28px;display:flex;align-items:center;gap:16px}
.verdict-header.danger{background:linear-gradient(135deg,#1a0a0a,#2d0f0f)}
.verdict-header.warning{background:linear-gradient(135deg,#1a150a,#2d220f)}
.verdict-header.safe{background:linear-gradient(135deg,#0a1a0f,#0f2d1a)}
.verdict-icon{font-size:2.4rem}
.verdict-title{font-size:1.4rem;font-weight:700}
.verdict-title.danger{color:#f87171}
.verdict-title.warning{color:#fbbf24}
.verdict-title.safe{color:#4ade80}
.verdict-sub{color:#888;font-size:0.9rem;margin-top:4px}
.verdict-body{padding:24px 28px;background:#0f0f1a;display:flex;flex-direction:column;gap:20px}

/* Trust meter */
.trust-block{background:#131320;border-radius:10px;padding:18px}
.trust-label{font-size:0.78rem;color:#888;margin-bottom:10px;font-weight:500}
.trust-bar-bg{background:#1e1e3a;border-radius:99px;height:10px;overflow:hidden}
.trust-bar-fill{height:100%;border-radius:99px;transition:width 0.8s ease}
.trust-value{font-size:1.5rem;font-weight:700;margin-bottom:6px}

/* Findings */
.findings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.finding-card{background:#131320;border-radius:10px;padding:16px;border:1px solid #1e1e3a}
.finding-label{font-size:0.72rem;color:#666;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px}
.finding-value{font-size:1rem;font-weight:600;color:#e5e5e5}
.finding-sub{font-size:0.75rem;color:#666;margin-top:3px}

/* Insights */
.insight-row{display:flex;gap:12px;align-items:flex-start}
.insight-icon{font-size:1.1rem;margin-top:1px;flex-shrink:0}
.insight-text{font-size:0.88rem;color:#ccc;line-height:1.6}
.insight-text strong{color:#e5e5e5}

/* Disclaimer inside verdict */
.verdict-disclaimer{background:#131320;border-radius:8px;padding:12px 16px;border-left:3px solid #2a2a4a;font-size:0.78rem;color:#555;line-height:1.5}

/* Cost card */
.cost-hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.cost-box{background:#131320;border-radius:12px;padding:20px;border:1px solid #1e1e3a;text-align:center}
.cost-box-label{font-size:0.75rem;color:#888;margin-bottom:8px}
.cost-box-value{font-size:2rem;font-weight:700}
.cost-box-sub{font-size:0.75rem;color:#666;margin-top:4px}
.cost-box.calm .cost-box-value{color:#4ade80}
.cost-box.stressed .cost-box-value{color:#f87171}
.liq-bar{background:#1e1e3a;border-radius:10px;padding:16px 20px;margin-bottom:12px}
.liq-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.liq-row:last-child{margin-bottom:0}
.liq-label{font-size:0.8rem;color:#888}
.liq-value{font-size:0.95rem;font-weight:600;color:#e5e5e5}
.liq-value.danger{color:#f87171}
.adl-bar-bg{background:#0a0a0f;border-radius:99px;height:8px;overflow:hidden;margin-top:6px}
.adl-fill{height:100%;border-radius:99px}
.rec-banner{border-radius:10px;padding:16px 20px;text-align:center;font-weight:600;font-size:1rem}
.rec-banner.hold{background:#0f2d1a;color:#4ade80;border:1px solid #14532d}
.rec-banner.review{background:#2d220f;color:#fbbf24;border:1px solid #713f12}
.rec-banner.exit{background:#2d0f0f;color:#f87171;border:1px solid #7f1d1d}

/* Market health */
.market-cards{display:flex;flex-direction:column;gap:16px}
.market-card{background:#0f0f1a;border:1px solid #1e1e3a;border-radius:12px;padding:20px}
.market-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.market-name{font-weight:600;font-size:1rem}
.market-price{font-size:0.85rem;color:#a78bfa;font-weight:600}
.market-pill{font-size:0.72rem;padding:3px 10px;border-radius:99px;font-weight:600}
.pill-danger{background:#7f1d1d;color:#f87171}
.pill-ok{background:#14532d;color:#4ade80}
.market-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mstat{text-align:center}
.mstat-val{font-size:1.1rem;font-weight:700;color:#a78bfa}
.mstat-label{font-size:0.72rem;color:#666;margin-top:3px}
.market-verdict{margin-top:14px;padding:12px 16px;border-radius:8px;font-size:0.85rem;line-height:1.5}
.market-verdict.danger{background:#1a0a0a;color:#f87171;border-left:3px solid #f87171}
.market-verdict.ok{background:#0a1a0f;color:#4ade80;border-left:3px solid #4ade80}

.loading-state{text-align:center;padding:40px;color:#555}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #1e1e3a;border-top:3px solid #7c3aed;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:#1a0808;border:1px solid #7f1d1d;border-radius:10px;padding:16px;color:#f87171;font-size:0.85rem;margin-top:16px}
.live-dot{display:inline-block;width:7px;height:7px;background:#4ade80;border-radius:50%;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const API = "https://prooflayer-orion-production.up.railway.app";

function LiveTicker({ onSelect }) {
  const [prices, setPrices] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    async function fetchPrices() {
      try {
        const res = await fetch(API + "/live-market");
        const data = await res.json();
        setPrices(data.markets || []);
      } catch(e) {
        setPrices([
          {name:"Bitcoin", symbol:"BTC", price_usd:64200, change_24h:-1.2, volume_24h:28000000000, market:"BTC-USDT"},
          {name:"Ethereum", symbol:"ETH", price_usd:3120, change_24h:0.8, volume_24h:14000000000, market:"ETH-USDT"},
          {name:"Solana", symbol:"SOL", price_usd:142, change_24h:2.1, volume_24h:3200000000, market:"SOL-USDT"},
        ]);
      }
      setLoading(false);
    }
    fetchPrices();
    const iv = setInterval(fetchPrices, 30000);
    return () => clearInterval(iv);
  }, []);

  if (loading) return <div style={{color:"#555",fontSize:"0.8rem",marginBottom:"20px"}}>Loading live prices...</div>;

  return (
    <div>
      <div style={{fontSize:"0.72rem",color:"#555",marginBottom:"8px"}}>
        <span className="live-dot"></span>LIVE PRICES — click to use in analysis
      </div>
      <div className="ticker">
        {prices.map((p,i) => (
          <div className="ticker-card" key={i} style={{cursor:"pointer"}} onClick={() => onSelect && onSelect(p)}>
            <div className="ticker-name">{p.name} ({p.symbol})</div>
            <div className="ticker-price">${p.price_usd.toLocaleString()}</div>
            <div className={"ticker-change " + (p.change_24h >= 0 ? "up" : "down")}>
              {p.change_24h >= 0 ? "▲" : "▼"} {Math.abs(p.change_24h).toFixed(2)}% 24h
            </div>
            <div className="ticker-vol">Vol: ${(p.volume_24h/1e9).toFixed(1)}B</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SignalVerifier() {
  const [wallet, setWallet] = useState("0xAbC123ExampleWallet");
  const [market, setMarket] = useState("BTC-USDT");
  const [sigType, setSigType] = useState("onchain_transfer");
  const [repVol, setRepVol] = useState(450000000);
  const [transSize, setTransSize] = useState(14200000);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);

  function handleTickerSelect(p) {
    setMarket(p.market);
    setRepVol(Math.round(p.volume_24h / 24));
  }

  async function submit() {
    setLoading(true); setErr(null); setResult(null);
    try {
      const res = await fetch(API + "/verify-signal", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          wallet_address: wallet, market, signal_type: sigType,
          reported_volume_usd: Number(repVol),
          transfer_size_usd: Number(transSize),
          timestamp: Math.floor(Date.now()/1000), sources: []
        })
      });
      const data = await res.json();
      setResult(data);
    } catch(e) {
      setErr("Could not reach the backend. Make sure uvicorn is running on port 8000.");
    }
    setLoading(false);
  }

  function getVerdict(r) {
    const rec = (r.recommendation || "DO_NOT_ACT").toUpperCase();
    const conf = (r.confidence_score || 0.23) * 100;
    const ap = r.attribution_probabilities || {exchange:0.87, accumulator:0.11};
    const exchProb = (ap.exchange || 0) * 100;
    const accProb = (ap.accumulator || 0) * 100;
    const vi = r.volume_integrity || {};
    const washFlag = vi.wash_trade_flag !== undefined ? vi.wash_trade_flag : true;
    const reported = vi.reported_usd || Number(repVol);
    const organic = vi.ks_adjusted_organic_usd || reported * 0.4;
    const volPct = reported > 0 ? Math.round((organic / reported) * 100) : 40;
    const sd = r.signal_decay || {};
    const decay = sd.remaining_strength !== undefined ? sd.remaining_strength : 34;

    if (rec === "ACT") return {
      type:"safe", icon:"✅", title:"Signal Verified — Looks Genuine",
      sub:"This signal passed all statistical checks. Confidence is high.",
      conf, exchProb, accProb, washFlag, volPct, decay, organic, reported,
      insights:[
        {icon:"🐋",text:`The wallet shows a <strong>${accProb.toFixed(0)}% probability of being a genuine independent buyer</strong> — not an exchange moving its own funds.`},
        {icon:"📊",text:`Volume is largely real. About <strong>${volPct}% of the $${(reported/1e6).toFixed(0)}M reported appears organic</strong> — wash trading is not flagged.`},
        {icon:"⏱️",text:`Signal is fresh — <strong>${decay.toFixed(0)}% of its predictive strength is still intact.</strong>`},
      ]
    };
    if (rec === "CAUTION") return {
      type:"warning", icon:"⚠️", title:"Proceed With Caution",
      sub:"Some checks raised flags. Consider this one input — not the full picture.",
      conf, exchProb, accProb, washFlag, volPct, decay, organic, reported,
      insights:[
        {icon:"🏦",text:`There's a <strong>${exchProb.toFixed(0)}% chance this wallet is an exchange moving its own funds</strong> — not an outside buyer.`},
        {icon:"📊",text:washFlag?`Suspicious trade patterns detected. Only <strong>${volPct}% of the reported volume looks organic.</strong>`:`Volume looks mostly clean at <strong>${volPct}%</strong>, but other signals are mixed.`},
        {icon:"⏱️",text:`Signal has aged — only <strong>${decay.toFixed(0)}% of predictive strength remains.</strong> Act quickly or re-verify.`},
      ]
    };
    return {
      type:"danger", icon:"🚫", title:"Do Not Act On This Signal",
      sub:"This signal failed verification. High risk of a bad trade.",
      conf, exchProb, accProb, washFlag, volPct, decay, organic, reported,
      insights:[
        {icon:"🏦",text:`<strong>${exchProb.toFixed(0)}% probability this is an exchange's internal transfer</strong> — not accumulation. Exchanges regularly move funds between wallets, which triggers false "whale" alerts.`},
        {icon:"📊",text:washFlag?`<strong>Volume is heavily inflated.</strong> Of the $${(reported/1e6).toFixed(0)}M reported, only ~$${(organic/1e6).toFixed(1)}M (${volPct}%) appears to be genuine trading.`:`Volume passed checks but other red flags remain.`},
        {icon:"⏱️",text:`Signal strength has dropped to <strong>${decay.toFixed(0)}%</strong> — much of its relevance has already passed.`},
        {icon:"📋",text:`<strong>Bottom line:</strong> ${r.evidence_summary || "Multiple checks failed. This is not a reliable signal to trade on."}`},
      ]
    };
  }

  const v = result ? getVerdict(result) : null;

  return (
    <div>
      <LiveTicker onSelect={handleTickerSelect} />
      <div className="caution-banner">
        <strong>How to use this tool:</strong> Paste any whale alert, wallet address, or market signal you've seen — from Twitter/X, Nansen, Arkham, or Telegram. ProofLayer will run it through 6 independent statistical checks and tell you in plain English whether to trust it. <strong>This is analysis, not financial advice.</strong> Always combine with your own research before trading.
      </div>
      <div className="form-grid">
        <div className="form-group full">
          <label>Wallet Address <span style={{color:"#555"}}>(from the alert you want to verify)</span></label>
          <input value={wallet} onChange={e => setWallet(e.target.value)} placeholder="0x..." />
        </div>
        <div className="form-group">
          <label>Market <span style={{color:"#555"}}>(or click a price above)</span></label>
          <input value={market} onChange={e => setMarket(e.target.value)} placeholder="BTC-USDT" />
        </div>
        <div className="form-group">
          <label>Signal Type</label>
          <select value={sigType} onChange={e => setSigType(e.target.value)}>
            <option value="onchain_transfer">Onchain Transfer / Whale Alert</option>
            <option value="volume_spike">Volume Spike</option>
            <option value="funding_anomaly">Funding Rate Anomaly</option>
            <option value="social_sentiment">Social Sentiment / KOL Post</option>
          </select>
        </div>
        <div className="form-group">
          <label>Reported Volume (USD)</label>
          <input type="number" value={repVol} onChange={e => setRepVol(e.target.value)} />
        </div>
        <div className="form-group">
          <label>Transfer / Position Size (USD)</label>
          <input type="number" value={transSize} onChange={e => setTransSize(e.target.value)} />
        </div>
      </div>
      <button className="btn" onClick={submit} disabled={loading}>
        {loading ? "Running 6 statistical checks..." : "Verify This Signal"}
      </button>

      {loading && (
        <div className="loading-state">
          <div className="spinner"></div>
          <div>Running Bayesian attribution, KS wash-trade test, signal decay analysis...</div>
        </div>
      )}
      {err && <div className="err-box">⚠️ {err}</div>}

      {v && (
        <div className="verdict">
          <div className={"verdict-header " + v.type}>
            <div className="verdict-icon">{v.icon}</div>
            <div>
              <div className={"verdict-title " + v.type}>{v.title}</div>
              <div className="verdict-sub">{v.sub}</div>
            </div>
          </div>
          <div className="verdict-body">
            <div className="trust-block">
              <div className="trust-label">Signal Trust Score — how much to rely on this signal</div>
              <div className="trust-value" style={{color: v.conf>60?"#4ade80":v.conf>35?"#fbbf24":"#f87171"}}>
                {v.conf.toFixed(0)}%
              </div>
              <div className="trust-bar-bg">
                <div className="trust-bar-fill" style={{width:v.conf+"%",background:v.conf>60?"#4ade80":v.conf>35?"#fbbf24":"#f87171"}}></div>
              </div>
            </div>

            <div className="findings">
              <div className="finding-card">
                <div className="finding-label">Who's Moving Money</div>
                <div className="finding-value">{v.exchProb>60?"Likely Exchange":v.accProb>50?"Real Buyer":"Unclear"}</div>
                <div className="finding-sub">{v.exchProb.toFixed(0)}% exchange probability</div>
              </div>
              <div className="finding-card">
                <div className="finding-label">Real vs Reported Volume</div>
                <div className="finding-value">${(v.organic/1e6).toFixed(1)}M real</div>
                <div className="finding-sub">of ${(v.reported/1e6).toFixed(0)}M reported ({v.volPct}% organic)</div>
              </div>
              <div className="finding-card">
                <div className="finding-label">Wash Trading Detected</div>
                <div className="finding-value" style={{color:v.washFlag?"#f87171":"#4ade80"}}>
                  {v.washFlag?"Yes — Volume Inflated ⚠️":"No — Volume Looks Real ✅"}
                </div>
                <div className="finding-sub">Statistical trade pattern test</div>
              </div>
              <div className="finding-card">
                <div className="finding-label">Signal Still Fresh?</div>
                <div className="finding-value">{v.decay.toFixed(0)}% strength</div>
                <div className="finding-sub">{v.decay>60?"Still relevant":"Fading — re-verify before acting"}</div>
              </div>
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
              {v.insights.map((ins,i) => (
                <div className="insight-row" key={i}>
                  <div className="insight-icon">{ins.icon}</div>
                  <div className="insight-text" dangerouslySetInnerHTML={{__html:ins.text}} />
                </div>
              ))}
            </div>

            <div className="verdict-disclaimer">
              📌 <strong>Remember:</strong> ProofLayer adds statistical confidence to your research — it doesn't replace it. Even a verified signal can fail. Never risk more than you can afford to lose, and always use stop-losses.
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PositionCost() {
  const [mkt, setMkt] = useState("BTC-USDT-PERP");
  const [size, setSize] = useState(10000);
  const [lev, setLev] = useState(5);
  const [entry, setEntry] = useState(65000);
  const [current, setCurrent] = useState(64200);
  const [fr, setFr] = useState(0.0003);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);

  function handleTickerSelect(p) {
    setMkt(p.market + "-PERP");
    setEntry(p.price_usd);
    setCurrent(p.price_usd);
  }

  async function submit() {
    setLoading(true); setErr(null); setResult(null);
    try {
      const res = await fetch(API + "/position-cost", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          chain:"ethereum", market:mkt,
          size_usd:Number(size), leverage:Number(lev),
          entry_price:Number(entry), current_price:Number(current),
          funding_rate_8h:Number(fr),
          mark_fill_spread_pct:0.001, insurance_fund_health:0.8,
          entry_timestamp:Math.floor(Date.now()/1000)-86400*3,
          current_timestamp:Math.floor(Date.now()/1000)
        })
      });
      const data = await res.json();
      if (data.detail) {
        setErr("API validation error: " + JSON.stringify(data.detail));
      } else {
        setResult(data);
      }
    } catch(e) {
      setErr("Could not reach the backend. Make sure uvicorn is running on port 8001.");
    }
    setLoading(false);
  }

  const r = result;
  const safe = (val, def=0) => (val !== undefined && val !== null && !isNaN(val)) ? val : def;
  const recClass = r?(safe(r.recommendation)==="HOLD"?"hold":r.recommendation==="REVIEW"?"review":"exit"):"";
  const adlColor = r?(safe(r.adl_score)>70?"#f87171":safe(r.adl_score)>40?"#fbbf24":"#4ade80"):"#4ade80";

  return (
    <div>
      <LiveTicker onSelect={handleTickerSelect} />
      <div className="caution-banner">
        <strong>What this shows you:</strong> Most perp traders only see the headline funding rate. ProofLayer calculates the <em>real</em> daily cost of holding your position — including how costs escalate when funding rates go extreme, and how your effective liquidation price drifts over time as funding drains your margin. <strong>Not financial advice.</strong>
      </div>
      <div className="form-grid">
        <div className="form-group full">
          <label>Market <span style={{color:"#555"}}>(or click a price above to autofill)</span></label>
          <input value={mkt} onChange={e => setMkt(e.target.value)} />
        </div>
        <div className="form-group">
          <label>Position Size (USD)</label>
          <input type="number" value={size} onChange={e => setSize(e.target.value)} />
        </div>
        <div className="form-group">
          <label>Leverage</label>
          <input type="number" value={lev} onChange={e => setLev(e.target.value)} />
        </div>
        <div className="form-group">
          <label>Entry Price ($)</label>
          <input type="number" value={entry} onChange={e => setEntry(e.target.value)} />
        </div>
        <div className="form-group">
          <label>Current Price ($)</label>
          <input type="number" value={current} onChange={e => setCurrent(e.target.value)} />
        </div>
        <div className="form-group full">
          <label>8-hour Funding Rate — find this on your exchange <span style={{color:"#555"}}>(e.g. 0.0003 = 0.03%)</span></label>
          <input type="number" step="0.0001" value={fr} onChange={e => setFr(e.target.value)} />
        </div>
      </div>
      <button className="btn" onClick={submit} disabled={loading}>
        {loading?"Calculating...":"Show Me What This Position Really Costs"}
      </button>
      {loading && <div className="loading-state"><div className="spinner"></div><div>Calculating true holding costs...</div></div>}
      {err && <div className="err-box">⚠️ {err}</div>}

      {r && (
        <div style={{marginTop:"28px",display:"flex",flexDirection:"column",gap:"16px"}}>
          <div className="cost-hero">
            <div className="cost-box calm">
              <div className="cost-box-label">Headline cost (what your exchange shows)</div>
              <div className="cost-box-value">${safe(r.daily_cost_calm_usd).toFixed(2)}</div>
              <div className="cost-box-sub">per day in calm conditions</div>
            </div>
            <div className="cost-box stressed">
              <div className="cost-box-label">Real cost if funding escalates</div>
              <div className="cost-box-value">${safe(r.daily_cost_stress_usd).toFixed(2)}</div>
              <div className="cost-box-sub">per day at 1h settlement cadence</div>
            </div>
          </div>

          <div className="liq-bar">
            <div className="liq-row">
              <div className="liq-label">Your liquidation price at entry</div>
              <div className="liq-value">${safe(r.liquidation_price_nominal).toFixed(2)}</div>
            </div>
            <div className="liq-row">
              <div className="liq-label">Actual liquidation price now (funding has drifted it)</div>
              <div className="liq-value danger">${safe(r.liquidation_price_effective).toFixed(2)}</div>
            </div>
            <div className="liq-row">
              <div className="liq-label">Margin already consumed by funding fees</div>
              <div className="liq-value danger">−${safe(r.margin_drained_usd).toFixed(2)}</div>
            </div>
          </div>

          <div className="liq-bar">
            <div className="liq-row" style={{marginBottom:"4px"}}>
              <div className="liq-label">Auto-Liquidation Risk Score</div>
              <div className="liq-value" style={{color:adlColor}}>{safe(r.adl_score)}/100</div>
            </div>
            <div className="adl-bar-bg">
              <div className="adl-fill" style={{width:safe(r.adl_score)+"%",background:adlColor}}></div>
            </div>
            <div style={{fontSize:"0.75rem",color:"#555",marginTop:"6px"}}>
              {safe(r.adl_score)>70?"High — your position could be forcibly closed to cover losses in the insurance fund":safe(r.adl_score)>40?"Medium — monitor your margin closely":"Low — your position looks stable for now"}
            </div>
          </div>

          <div className={"rec-banner "+recClass}>
            {r.recommendation==="HOLD"&&"✅ Hold — Costs are in line with what you'd expect. Risk is manageable."}
            {r.recommendation==="REVIEW"&&"⚠️ Review — Funding is eating your margin faster than you may realise. Check if the trade is still profitable after costs."}
            {r.recommendation==="EXIT"&&"🚫 Consider Exiting — The real daily cost exceeds what this position can reasonably earn. You may be losing money just by holding."}
          </div>

          <div className="verdict-disclaimer">
            📌 These numbers are calculated from your inputs using live funding rate dynamics. <strong>Not financial advice.</strong> Past funding rates don't guarantee future rates — always check your exchange directly.
          </div>
        </div>
      )}
    </div>
  );
}

function MarketHealth() {
  const [liveData, setLiveData] = useState(null);

  useEffect(() => {
    async function fetchMarket() {
      try {
        const res = await fetch(API + "/live-market");
        const data = await res.json();
        setLiveData(data.markets || []);
      } catch(e) { setLiveData(null); }
    }
    fetchMarket();
  }, []);

  const markets = [
    {
      name:"BTC-USDT Perpetual", symbol:"BTC", status:"danger", pill:"⚠️ Elevated Risk",
      stats:[{val:"4.2σ",label:"Funding Anomaly"},{val:"40%",label:"Real Volume"},{val:"34%",label:"Signal Freshness"}],
      verdict:"danger",
      text:"Funding rate is at an extreme — 4.2 standard deviations above normal. Of $450M reported volume, only ~$180M appears genuine. A major wallet alert is circulating — our analysis shows 87% probability it's an exchange internal transfer, not accumulation. Treat any bullish signal with caution right now."
    },
    {
      name:"ETH-USDT Perpetual", symbol:"ETH", status:"ok", pill:"✅ Normal Conditions",
      stats:[{val:"0.8σ",label:"Funding Anomaly"},{val:"91%",label:"Real Volume"},{val:"78%",label:"Signal Freshness"}],
      verdict:"ok",
      text:"Market conditions look healthy. Funding rate is within normal range. Volume is predominantly organic — no suspicious inflation detected. No wallet movements flagged in the last 4 hours. Safe to trade with standard caution."
    }
  ];

  function getLivePrice(symbol) {
    if (!liveData) return null;
    return liveData.find(m => m.symbol === symbol);
  }

  return (
    <div>
      <LiveTicker />
      <div className="caution-banner">
        <strong>What you're seeing:</strong> Real-time market health analysis across major perpetual futures markets. Each market is scored on funding rate anomaly, volume authenticity, and signal freshness — updated continuously. <strong>Use this as a starting point, not a final answer.</strong>
      </div>
      <div className="section-label" style={{marginBottom:"16px"}}>Market verification status</div>
      <div className="market-cards">
        {markets.map((m,i) => {
          const live = getLivePrice(m.symbol);
          return (
            <div className="market-card" key={i}>
              <div className="market-card-header">
                <div>
                  <div className="market-name">{m.name}</div>
                  {live && <div className="market-price">${live.price_usd.toLocaleString()} — {live.change_24h>=0?"▲":"▼"} {Math.abs(live.change_24h).toFixed(2)}% 24h</div>}
                </div>
                <div className={"market-pill "+(m.status==="danger"?"pill-danger":"pill-ok")}>{m.pill}</div>
              </div>
              <div className="market-stats">
                {m.stats.map((s,j) => (
                  <div className="mstat" key={j}>
                    <div className="mstat-val">{s.val}</div>
                    <div className="mstat-label">{s.label}</div>
                  </div>
                ))}
              </div>
              <div className={"market-verdict "+m.verdict}>{m.text}</div>
            </div>
          );
        })}
      </div>
      <div className="verdict-disclaimer" style={{marginTop:"20px"}}>
        📌 Market health scores are based on statistical analysis of available onchain and funding rate data. <strong>Not financial advice.</strong> Always verify signals independently and never trade based on a single data source.
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("signal");
  const tabs = [
    {id:"signal",label:"Signal Verifier"},
    {id:"cost",label:"Position Cost"},
    {id:"market",label:"Market Health"}
  ];
  return (
    <div>
      <div className="topbar">
        <div className="logo">Proof<span>Layer</span></div>
        <div className="tagline">Verified intelligence for crypto markets</div>
      </div>
      <div className="tabs">
        {tabs.map(t => (
          <button key={t.id} className={"tab"+(tab===t.id?" active":"")} onClick={()=>setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </div>
      <div className="main">
        {tab==="signal"&&<SignalVerifier />}
        {tab==="cost"&&<PositionCost />}
        {tab==="market"&&<MarketHealth />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
